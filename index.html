<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGenie</title>
    
    <!-- Import Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Import React and ReactDOM first -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Import Babel before our script -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Import Lucide Icons (specific version and correct build) -->
    <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    
    <!-- Import Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes glow-sweep {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .animate-glow-sweep {
            background-size: 200% 100%;
            animation: glow-sweep 3s linear infinite;
        }

        /* Try on ExamAI button styles */
        .button-gradient {
            background: linear-gradient(90deg, #8B5CF6, #D946EF, #8B5CF6);
            background-size: 200% auto;
            animation: glow-sweep 3s linear infinite;
        }

        .button-glass {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        .button-hover:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .blob {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            pointer-events: none;
            z-index: -1;
            animation: blob-float 25s infinite ease-in-out;
        }

        .blob-1 {
            background: #8B5CF6;
            top: -200px;
            left: -100px;
            width: 800px;
            height: 800px;
            animation-delay: 0s;
            opacity: 0.12;
        }

        .blob-2 {
            background: #D946EF;
            bottom: -100px;
            right: -100px;
            width: 700px;
            height: 700px;
            animation-delay: -5s;
            opacity: 0.1;
        }

        .blob-3 {
            background: #F97316;
            top: 50%;
            left: 30%;
            width: 500px;
            height: 500px;
            animation-delay: -10s;
            opacity: 0.08;
        }

        .blob-4 {
            background: #0EA5E9;
            top: 20%;
            right: 20%;
            width: 600px;
            height: 600px;
            animation-delay: -15s;
            opacity: 0.1;
        }

        .blob-5 {
            background: #8B5CF6;
            bottom: 30%;
            left: 20%;
            width: 550px;
            height: 550px;
            animation-delay: -20s;
            opacity: 0.09;
        }

        .blob-6 {
            background: #D946EF;
            top: 40%;
            right: 35%;
            width: 650px;
            height: 650px;
            animation-delay: -8s;
            opacity: 0.08;
        }

        @keyframes blob-float {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            20% {
                transform: translate(120px, -50px) scale(1.1) rotate(90deg);
            }
            40% {
                transform: translate(-80px, 80px) scale(0.9) rotate(180deg);
            }
            60% {
                transform: translate(100px, 100px) scale(1.2) rotate(270deg);
            }
            80% {
                transform: translate(-50px, -50px) scale(0.8) rotate(360deg);
            }
            100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
        }

        .option-selected {
            border-color: rgb(137, 43, 226);
            background-color: rgba(137, 43, 226, 0.2);
        }

        .option-default {
            border-color: rgba(137, 43, 226, 0.3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .loading-spinner {
            position: relative;
        }

        .loading-spinner div:nth-child(1) {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(137, 43, 226, 0.3);
            animation: spin 3s linear infinite;
        }

        .loading-spinner div:nth-child(2) {
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(137, 43, 226, 0.4);
            animation: spin 2s linear infinite;
        }

        .loading-spinner div:nth-child(3) {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(137, 43, 226, 0.5);
            animation: spin 1s linear infinite;
        }

        /* Gradient text animation */
        .gradient-text {
            background: linear-gradient(
                90deg,
                #ea384c 0%,
                #d946ef 25%,
                #892be2 50%,
                #9b87f5 75%,
                #ea384c 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 8s linear infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Hero text reveal animation */
        .reveal-text {
            animation: reveal 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        @keyframes reveal {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Floating animation for decorator elements */
        .float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Icon float animations */
        .float-icon {
            position: absolute;
            opacity: 0.7;
            animation: float-icon 8s ease-in-out infinite;
        }

        .float-icon-delay-1 { animation-delay: -2s; }
        .float-icon-delay-2 { animation-delay: -4s; }
        .float-icon-delay-3 { animation-delay: -6s; }

        @keyframes float-icon {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.4;
            }
            25% {
                transform: translate(10px, -15px) rotate(5deg);
                opacity: 0.7;
            }
            50% {
                transform: translate(-5px, -25px) rotate(-5deg);
                opacity: 0.4;
            }
            75% {
                transform: translate(-15px, -15px) rotate(5deg);
                opacity: 0.7;
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.4;
            }
        }

        /* Shine effect for gradient borders */
        .gradient-border {
            position: relative;
            background: linear-gradient(90deg, #892be2, #ea384c, #d946ef);
            background-size: 200% auto;
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
    <div class="blob blob-6"></div>
    <div id="root"></div>

    <script type="text/babel">
        console.log('Script starting...');
        console.log('Window React:', !!window.React);
        console.log('Window ReactDOM:', !!window.ReactDOM);
        console.log('Window Babel:', !!window.Babel);
        console.log('Window lucide:', !!window.lucide);

        const createIcon = (name, size, className) => {
            console.log('Creating icon:', name, size, className);
            const icon = lucide.createIcons({
                icons: {
                    [name]: {
                        width: size,
                        height: size,
                        class: className
                    }
                }
            });
            return `<i data-lucide="${name}"></i>`;
        };

        const createCheckIcon = (id) => {
            const container = document.getElementById(id);
            if (container) {
                container.innerHTML = createIcon('check', 14, 'text-[#892be2]');
                lucide.createIcons();
            }
        };

        const IconWrapper = ({ iconName, className, size = 24 }) => {
            React.useEffect(() => {
                const container = document.getElementById(`icon-${iconName}`);
                if (container) {
                    container.innerHTML = createIcon(iconName, size, `text-[#892be2]/40`);
                    lucide.createIcons();
                }
            }, [iconName, size]);

            return (
                <div id={`icon-${iconName}`} className={`float-icon ${className}`}></div>
            );
        };

        const placeholderTexts = [
            "Create a biology quiz",
            "Make a physics midterm",
            "Design a math homework",
            "Generate a chemistry test",
            "Build an english exam",
            "Create a history quiz",
            "Make a psychology test",
            "Design a geography exam",
            "Generate a literature quiz",
            "Build an economics test"
        ];

        function App() {
            console.log('App component rendering');
            const [prompt, setPrompt] = React.useState("");
            const [loading, setLoading] = React.useState(false);
            const [questions, setQuestions] = React.useState([]);
            const [placeholderIndex, setPlaceholderIndex] = React.useState(0);
            const [isTyping, setIsTyping] = React.useState(true);
            const [currentText, setCurrentText] = React.useState("");

            React.useEffect(() => {
                console.log('App mounted');
                console.log('Window width:', window.innerWidth);
                console.log('Document ready state:', document.readyState);

                let timeout;

                if (isTyping) {
                    const text = placeholderTexts[placeholderIndex];
                    if (currentText.length < text.length) {
                        timeout = setTimeout(() => {
                            setCurrentText(text.slice(0, currentText.length + 1));
                        }, 50);
                    } else {
                        timeout = setTimeout(() => {
                            setIsTyping(false);
                        }, 1000);
                    }
                } else {
                    if (currentText.length > 0) {
                        timeout = setTimeout(() => {
                            setCurrentText(currentText.slice(0, -1));
                        }, 30);
                    } else {
                        timeout = setTimeout(() => {
                            setPlaceholderIndex((prev) => (prev + 1) % placeholderTexts.length);
                            setIsTyping(true);
                        }, 300);
                    }
                }

                questions.forEach((question, idx) => {
                    if (isMultipleChoice(question.question)) {
                        parseMultipleChoice(question.question).options.forEach((option, optIdx) => {
                            if (question.rubrics && 
                                question.rubrics[0] && 
                                question.rubrics[0].rubric && 
                                question.rubrics[0].rubric.includes(option)) {
                                createCheckIcon(`check-icon-${idx}-${optIdx}`);
                            }
                        });
                    }
                });

                return () => clearTimeout(timeout);
            }, [currentText, isTyping, placeholderIndex, questions]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!prompt.trim()) {
                    return;
                }

                setLoading(true);
                try {
                    const formData = new FormData();
                    formData.append("additionalText", prompt);

                    const response = await fetch("https://create-exam-func.azurewebsites.net/analyze_input", {
                        method: "POST",
                        body: formData,
                    });

                    if (!response.ok) throw new Error("Failed to generate exam");
                    
                    const data = await response.json();
                    setQuestions(data.questions);
                } catch (error) {
                    console.error("Error generating exam:", error);
                } finally {
                    setLoading(false);
                }
            };

            const isMultipleChoice = (question) => {
                return question && question.startsWith("QQ:");
            };

            const parseMultipleChoice = (question) => {
                if (!question) return { question: "", options: [] };
                const [mainQuestion, ...options] = question.replace("QQ:", "").split("AA:").map(s => s.trim());
                return {
                    question: mainQuestion.replace(";", "").trim(),
                    options: options.map(option => option.replace(";", "").trim()).filter(Boolean),
                };
            };

            const getOptionClassName = (question, option) => {
                const baseClass = "w-5 h-5 rounded border transition-colors duration-200";
                if (!question || !question.rubrics || !question.rubrics[0] || !question.rubrics[0].rubric) {
                    return baseClass + " option-default";
                }
                return question.rubrics && 
                       question.rubrics[0] && 
                       question.rubrics[0].rubric && 
                       question.rubrics[0].rubric.includes(option) 
                    ? baseClass + " option-selected"
                    : baseClass + " option-default";
            };

            return (
                <div className="min-h-screen w-full p-4 sm:p-6 md:p-8 flex items-start justify-center">
                    {/* Main wrapper - 70% width */}
                    <div className="w-[70%] max-w-[1400px]">
                        {/* Hero Section with icon container */}
                        <div className="relative mb-8 md:mb-12 pt-8 md:pt-12 px-4">
                            {/* New floating icons container with flex */}
                            <div className="absolute inset-0 overflow-hidden pointer-events-none">
                                <div className="w-full h-full flex flex-wrap justify-around items-center">
                                    <div className="relative">
                                        <IconWrapper iconName="graduation-cap" className="absolute top-0 float-icon-delay-1" size={22} />
                                    </div>
                                    <div className="relative">
                                        <IconWrapper iconName="book-open" className="absolute top-20 float-icon-delay-2" size={20} />
                                    </div>
                                    <div className="relative">
                                        <IconWrapper iconName="brain" className="absolute bottom-10 float-icon-delay-3" size={22} />
                                    </div>
                                    <div className="relative">
                                        <IconWrapper iconName="atom" className="absolute top-32 float-icon-delay-1" size={18} />
                                    </div>
                                    <div className="relative">
                                        <IconWrapper iconName="lightbulb" className="absolute bottom-20 float-icon-delay-2" size={20} />
                                    </div>
                                    <div className="relative">
                                        <IconWrapper iconName="microscope" className="absolute top-16 float-icon-delay-3" size={22} />
                                    </div>
                                </div>
                            </div>

                            <div className="text-center space-y-6 relative z-10">
                                <div className="space-y-2">
                                    <h1 className="text-3xl md:text-6xl lg:text-7xl font-bold tracking-tight reveal-text" style={{animationDelay: '0.2s'}}>
                                        <span className="text-black">Revolutionizing Grading</span>
                                    </h1>
                                    <h1 className="text-3xl md:text-4xl lg:text-6xl font-bold tracking-tight gradient-text reveal-text" style={{animationDelay: '0.4s'}}>
                                        ExamAI
                                    </h1>
                                </div>
                                
                                <p className="text-base md:text-xl lg:text-2xl text-[#892be2]/70 max-w-2xl mx-auto reveal-text" style={{animationDelay: '0.6s'}}>
                                    Transform your assessment process with AI-powered grading
                                </p>

                                <div className="flex flex-wrap justify-center gap-2 md:gap-3 reveal-text" style={{animationDelay: '0.8s'}}>
                                    <div className="px-3 py-1 md:px-4 md:py-1.5 bg-gradient-to-r from-[#892be2]/5 to-[#892be2]/10 rounded-full text-xs md:text-sm text-[#892be2] border border-[#892be2]/20 backdrop-blur-sm">
                                        <span className="font-semibold">100%</span> Automated
                                    </div>
                                    <div className="px-3 py-1 md:px-4 md:py-1.5 bg-gradient-to-r from-[#ea384c]/5 to-[#ea384c]/10 rounded-full text-xs md:text-sm text-[#ea384c] border border-[#ea384c]/20 backdrop-blur-sm">
                                        <span className="font-semibold">AI</span> Powered
                                    </div>
                                    <div className="px-3 py-1 md:px-4 md:py-1.5 bg-gradient-to-r from-[#d946ef]/5 to-[#d946ef]/10 rounded-full text-xs md:text-sm text-[#d946ef] border border-[#d946ef]/20 backdrop-blur-sm">
                                        <span className="font-semibold">Professor</span> Guided
                                    </div>
                                </div>

                                <div className="w-32 h-px bg-gradient-to-r from-transparent via-[#892be2]/20 to-transparent mx-auto my-6 md:my-8"></div>
                            </div>
                        </div>

                        {/* Main Content - Exam Generator */}
                        <div className="w-full bg-[#892be2]/5 backdrop-blur-xl rounded-2xl md:rounded-3xl border border-[#892be2]/20 shadow-2xl overflow-hidden animate-fade-in relative">
                            {questions.length > 0 && (
                                <div>
                                    {/* Desktop version of Try on ExamAI button */}
                                    <a
                                        href="https://app.examai.ai/signup"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="absolute top-4 right-4 z-10 hidden md:block"
                                    >
                                        <div className="relative group">
                                            <div className="absolute -inset-0.5 rounded-full bg-gradient-to-r from-purple-500 via-pink-500 to-purple-500 opacity-80 animate-glow-sweep" />
                                            <button className="relative px-4 py-2 rounded-full bg-white bg-opacity-10 border border-white border-opacity-20 text-sm font-medium text-white shadow-lg transition-all duration-300 hover:bg-opacity-20 transform hover:scale-105">
                                                Try on ExamAI
                                            </button>
                                        </div>
                                    </a>
                                </div>
                            )}
                        
                            <div className="p-4 md:p-8 space-y-6 md:space-y-8">
                                <div className="text-center space-y-3 md:space-y-4 mb-6 md:mb-8">
                                    <h1 className="text-2xl md:text-3xl font-semibold text-[#892be2]/90">From Idea to Exam</h1>
                                    <p className="text-base md:text-lg text-[#892be2]/70">Design your perfect assessment</p>
                                    <div className="h-0.5 w-24 md:w-32 bg-gradient-to-r from-transparent via-[#892be2]/20 to-transparent mx-auto" />
                                    
                                    {/* Mobile version of Try on ExamAI button */}
                                    {questions.length > 0 && (
                                        <a
                                            href="https://app.examai.ai/signup"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="block md:hidden mt-4"
                                        >
                                            <div className="relative group inline-block">
                                                <div className="absolute -inset-0.5 rounded-full bg-gradient-to-r from-purple-500 via-pink-500 to-purple-500 opacity-80 animate-glow-sweep" />
                                                <button className="relative px-4 py-2 rounded-full bg-white bg-opacity-10 border border-white border-opacity-20 text-sm font-medium text-white shadow-lg transition-all duration-300 hover:bg-opacity-20 transform hover:scale-105">
                                                    Try on ExamAI
                                                </button>
                                            </div>
                                        </a>
                                    )}
                                </div>

                                <div className="space-y-6 md:space-y-8">
                                    {!loading && questions.length === 0 && (
                                        <form onSubmit={handleSubmit} className="space-y-4 animate-fade-in">
                                            <div className="relative">
                                                <p className="text-[#892be2]/80 mb-2 text-sm font-medium">Enter your exam requirements</p>
                                                <textarea
                                                    value={prompt}
                                                    onChange={(e) => setPrompt(e.target.value)}
                                                    placeholder={currentText}
                                                    className="w-full min-h-[100px] md:min-h-[120px] bg-white/80 backdrop-blur-md border border-[#892be2]/20 rounded-xl md:rounded-2xl p-4 md:p-6 text-sm md:text-base text-[#892be2]/90 placeholder-[#892be2]/40 focus:ring-2 focus:ring-[#892be2]/30 focus:border-[#892be2]/30 transition-all duration-300 resize-none"
                                                />
                                                <button
                                                    type="submit"
                                                    className="mt-4 block mx-auto bg-purple-600 text-white px-6 py-3 rounded-full hover:bg-purple-700 transition-all duration-300 shadow-lg hover:shadow-purple-300 md:mt-0 md:absolute md:bottom-4 md:right-4"
                                                >
                                                    Generate Exam
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {loading && (
                                        <div className="flex flex-col items-center justify-center space-y-4 py-12 animate-fade-in">
                                            <div className="loading-spinner w-16 h-16">
                                                <div></div>
                                                <div></div>
                                                <div></div>
                                            </div>
                                            <p className="text-purple-70 animate-pulse">Generating your exam...</p>
                                        </div>
                                    )}

                                    {!loading && questions.length > 0 && (
                                        <div className="space-y-6">
                                            {questions.map((question, idx) => (
                                                <div
                                                    key={idx}
                                                    className="bg-white/90 backdrop-blur-md border border-[#892be2]/20 rounded-2xl p-6 shadow-lg transition-all duration-300 hover:bg-white/95 animate-fade-in"
                                                    style={{animationDelay: `${idx * 100}ms`}}
                                                >
                                                    <div className="space-y-4">
                                                        {isMultipleChoice(question.question) ? (
                                                            <div className="space-y-4">
                                                                <div className="flex items-center justify-between">
                                                                    <span className="px-3 py-1 bg-[#892be2]/10 text-[#892be2] text-xs md:text-sm rounded-full border border-[#892be2]/30">
                                                                        Multiple Choice
                                                                    </span>
                                                                    <span className="px-3 py-1 bg-[#892be2]/10 text-[#892be2] text-xs md:text-sm rounded-full">
                                                                        {question.weight} pts
                                                                    </span>
                                                                </div>
                                                                <h3 className="text-lg md:text-xl font-medium text-[#892be2]/80">
                                                                    {parseMultipleChoice(question.question).question}
                                                                </h3>
                                                                <div className="space-y-3 pl-4">
                                                                    {parseMultipleChoice(question.question).options.map((option, optIdx) => (
                                                                        <div key={optIdx} className="flex items-center gap-4 group">
                                                                            <div className={getOptionClassName(question, option)}>
                                                                                {question.rubrics && 
                                                                                 question.rubrics[0] && 
                                                                                 question.rubrics[0].rubric && 
                                                                                 question.rubrics[0].rubric.includes(option) && (
                                                                                    <div className="w-full h-full flex items-center justify-center">
                                                                                        <div id={`check-icon-${idx}-${optIdx}`} className="text-[#892be2]"></div>
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                            <label className="text-base md:text-lg text-[#892be2]/60 group-hover:text-[#892be2]/80 transition-colors duration-200">
                                                                                {option}
                                                                            </label>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="space-y-4">
                                                                <div className="flex items-center justify-between">
                                                                    <span className="px-3 py-1 bg-[#892be2]/10 text-[#892be2] text-xs md:text-sm rounded-full border border-[#892be2]/30">
                                                                        Open Answer
                                                                    </span>
                                                                    <span className="px-3 py-1 bg-[#892be2]/10 text-[#892be2] text-xs md:text-sm rounded-full">
                                                                        {question.weight} pts
                                                                    </span>
                                                                </div>
                                                                <h3 className="text-lg md:text-xl font-medium text-[#892be2]/80">
                                                                    {question.question}
                                                                </h3>
                                                                <div className="mt-4 space-y-3">
                                                                    <h4 className="text-base md:text-lg font-medium text-[#892be2]/70">
                                                                        Rubric:
                                                                    </h4>
                                                                    <div className="space-y-3">
                                                                        {question.rubrics.map((rubric, rubricIdx) => (
                                                                            <div
                                                                                key={rubricIdx}
                                                                                className="flex justify-between items-start gap-4 p-3 bg-[#892be2]/5 rounded-xl border border-[#892be2]/10 hover:bg-[#892be2]/10 transition-colors duration-200"
                                                                            >
                                                                                <span className="text-base md:text-lg text-[#892be2]/60 flex-1">
                                                                                    {rubric.rubric}
                                                                                </span>
                                                                                <span className="text-sm md:text-base text-[#892be2]/70 whitespace-nowrap px-3 py-1 bg-[#892be2]/10 rounded-full">
                                                                                    {rubric.weight} pts
                                                                                </span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Make sure Lucide is loaded before rendering
        window.addEventListener('load', () => {
            console.log('Window load event fired');
            console.log('Lucide available:', !!window.lucide);
            if (window.lucide) {
                console.log('Initializing React app...');
                const root = ReactDOM.createRoot(document.getElementById("root"));
                root.render(<App />);
                console.log('React app initialized');
            } else {
                console.error('Lucide not available at load');
            }
        });
    </script>
</body>
</html>
